version: '3'

tasks:
  install:
    desc: Install Dashboard dependencies in the website/ directory
    dir: website
    cmds:
      - npm install

  dev:
    desc: Start the Astro development server for the Dashboard
    dir: website
    cmds:
      - npm run dev

  build:
    desc: Run the Astro production build for the Dashboard
    dir: website
    cmds:
      - npm run build

  preview:
    desc: Serve the production build of the Dashboard locally
    dir: website
    cmds:
      - npm run preview

  clean:
    desc: Remove build artifacts from the website/ directory
    dir: website
    cmds:
      - rm -rf dist .astro
